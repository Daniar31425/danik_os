name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: for script in scripts/*.sh iso/profile/profiledef.append.sh; do bash -n "$script"; done
      - run: shellcheck scripts/*.sh
# This job does not build an Arch ISO. Build and VM acceptance run on Arch Linux.
